<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세특 참고 서가 · 합격생 기록 과목별 보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800;900&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --bg2:#F1F3F6; --ink:#1E2229; --muted:#5A616C; --faint:#8D949E;
  --line:#DDE1E6; --line2:#ECEEF1;
  --sc:#1E2229; --on:#FFFFFF;
  --a:#1F7A4D; --b:#2546C7; --c:#7A808A; --d:#C2570C;
  --red:#D7263D;
  --sans:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --serif:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16181C; --bg2:#1F2228; --ink:#E9EBEE; --muted:#A7ADB6; --faint:#7E858F;
    --line:#33373E; --line2:#272A30;
    --a:#5BC48C; --b:#8CA6FF; --c:#A7ADB6; --d:#F29A55; --red:#FF6B7D; --gt:#16181C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16181C; --bg2:#1F2228; --ink:#E9EBEE; --muted:#A7ADB6; --faint:#7E858F;
  --line:#33373E; --line2:#272A30;
  --a:#5BC48C; --b:#8CA6FF; --c:#A7ADB6; --d:#F29A55; --red:#FF6B7D; --gt:#16181C;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}

/* 맨 위 줄 */
.top{max-width:1280px;margin:0 auto;padding:16px 28px 12px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{font-weight:900;font-size:17px;letter-spacing:-.03em;display:flex;align-items:center;gap:10px}
.brand i{display:inline-grid;grid-template-columns:repeat(3,6px);gap:2px}
.brand i b{width:6px;height:16px;display:block}
.top nav{margin-left:auto;display:flex;gap:20px;font-size:14.5px}
.top nav a{text-decoration:none;color:var(--muted);padding:4px 0;border-bottom:2px solid transparent;font-weight:500}
.top nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.top nav .cnt{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;background:var(--red);color:#fff;font-size:11.5px;font-weight:700;text-align:center;border-radius:9px;line-height:18px}
.top nav .cnt:empty{display:none}

/* 색인 탭 */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);border-bottom:4px solid var(--sc)}
.tabs ul{max-width:1280px;margin:0 auto;padding:0 28px;list-style:none;display:flex;gap:3px;overflow-x:auto;scrollbar-width:thin}
.tabs a{display:block;white-space:nowrap;text-decoration:none;font-size:14px;font-weight:600;padding:9px 12px 7px;background:var(--bg2);color:var(--muted);border-top:4px solid var(--tc);margin-top:6px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--tc);color:#fff;margin-top:0;padding-top:12px}

/* 과목 머리 */
.band{background:var(--sc);color:var(--on)}
.band-in{max-width:1280px;margin:0 auto;padding:30px 28px 30px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px 48px}
.band h1{margin:0;font-weight:900;font-size:clamp(46px,8vw,92px);line-height:.95;letter-spacing:-.05em}
.band h1 small{display:block;font-size:15px;font-weight:600;letter-spacing:0;margin-top:14px;opacity:.85}
.band .lede{margin:14px 0 0;max-width:62ch;font-size:15px;opacity:.92;line-height:1.7}
.band h3{margin:0 0 8px;font-size:13px;font-weight:700;opacity:.8}
.subs{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.chip{border:1.5px solid rgba(255,255,255,.55);background:transparent;color:inherit;padding:4px 10px;font-size:13.5px;font-weight:600;cursor:pointer;border-radius:2px}
.chip .n{opacity:.7;margin-left:4px;font-weight:400}
.chip:hover{border-color:#fff}
.chip[aria-pressed="true"]{background:#fff;color:var(--sc);border-color:#fff}
.side-stats{display:flex;flex-direction:column;gap:22px}
.verbs{display:flex;flex-wrap:wrap;gap:4px 12px}
.verb{border:0;background:none;color:inherit;padding:1px 0;font-size:14.5px;font-weight:700;cursor:pointer;border-bottom:2px solid rgba(255,255,255,.3)}
.verb .n{font-weight:400;font-size:12px;opacity:.7;margin-left:2px}
.verb[aria-pressed="true"]{border-bottom-color:#fff;background:rgba(255,255,255,.18)}
.stack{display:flex;height:12px;width:100%;background:rgba(255,255,255,.18)}
.stack span{display:block;height:100%}
.legend{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;margin-top:8px;font-size:12.5px}
.legend i{width:10px;height:10px;display:inline-block;margin-top:5px}
.legend em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;opacity:.85}
.band.plain{--sc:var(--bg2);--on:var(--ink)}
.band.plain .chip{border-color:var(--line)}

/* 본문 */
.body{max-width:1280px;margin:0 auto;padding:26px 28px 70px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px}
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);align-self:start;display:flex;flex-direction:column;gap:20px;font-size:14px}
.filters summary{display:none}
.fl h4{margin:0 0 7px;font-size:12.5px;font-weight:700;color:var(--muted)}
.search{width:100%;border:0;border-bottom:2px solid var(--ink);background:none;padding:8px 2px;font-size:15px;border-radius:0}
.search::placeholder{color:var(--faint)}
.checks{display:flex;flex-direction:column;gap:5px}
.checks label{display:flex;gap:8px;align-items:center;cursor:pointer}
.checks input{accent-color:var(--ink);width:15px;height:15px;margin:0}
.checks .sq{width:10px;height:10px;display:inline-block;flex:none}
.radios{display:flex;border:1.5px solid var(--ink)}
.radios button{flex:1;border:0;background:none;padding:6px 4px;font-size:13px;cursor:pointer;border-right:1.5px solid var(--ink);font-weight:600}
.radios button:last-child{border-right:0}
.radios button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.filters select{width:100%;border:1.5px solid var(--line);background:var(--bg);padding:7px 6px;border-radius:0}
.rule{border-left:4px solid var(--red);padding:2px 0 2px 12px;font-size:13.5px;line-height:1.65;color:var(--ink)}
.rule b{color:var(--red);display:block;margin-bottom:2px}

.status{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 6px;font-size:14px;color:var(--muted)}
.status strong{font-size:22px;font-weight:900;color:var(--ink);letter-spacing:-.02em}
.status button{border:0;background:none;color:var(--red);cursor:pointer;padding:0;font-weight:700;font-size:13.5px}

/* 기록 한 줄 */
.rec{display:grid;grid-template-columns:72px minmax(0,1fr);gap:0 20px;padding:24px 0;border-top:1.5px solid var(--ink)}
.rec:first-child{border-top-width:3px}
.num{font-weight:900;font-size:13px;color:var(--rc);line-height:1.2}
.num b{display:block;font-size:30px;letter-spacing:-.04em;line-height:1}
.meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;font-size:13.5px;color:var(--muted)}
.meta .subj{font-weight:800;color:var(--ink);font-size:15px}
.grade{font-weight:800;font-size:12px;color:var(--gt,#fff);padding:1px 6px}
.grade.A{background:var(--a)} .grade.B{background:var(--b)} .grade.C{background:var(--c)} .grade.D{background:var(--d)}
.est{font-size:12.5px;color:var(--d);font-weight:600}
.text{font-family:var(--serif);font-size:17px;line-height:1.95;margin:10px 0 18px;max-width:68ch;word-break:keep-all;overflow-wrap:anywhere}
.text mark{background:#FFE45C;color:#1E2229;padding:0 1px}

/* 흐름선 */
.flow{list-style:none;padding:0;margin:0 0 16px;display:flex;flex-wrap:wrap;row-gap:14px;max-width:760px}
.flow li{position:relative;flex:1 1 0;min-width:110px;padding:16px 12px 0 0;font-size:13.5px;font-weight:600;line-height:1.4}
.flow li::before{content:"";position:absolute;left:0;right:0;top:5px;height:2px;background:var(--rc)}
.flow li:last-child::before{right:auto;width:12px}
.flow li::after{content:"";position:absolute;left:0;top:0;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--rc)}
.flow li:first-child::after{background:var(--rc)}

.why{font-size:14.5px;margin:0 0 10px;max-width:68ch}
.why b{font-weight:800;margin-right:8px;color:var(--rc)}
.tags{font-size:13px;color:var(--muted);margin:0 0 12px}
.tags b{font-weight:700;color:var(--ink);margin-right:6px}
.note{font-size:13px;color:var(--d);margin:0 0 10px}
.foot{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12.5px;color:var(--faint)}
.foot .sp{flex:1}
.foot a{font-size:13.5px;font-weight:700;color:var(--ink);text-underline-offset:3px}
.act{border:1.5px solid var(--ink);background:none;padding:4px 11px;font-size:13px;font-weight:700;cursor:pointer}
.act:hover{background:var(--bg2)}
.act[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.more{margin:24px 0 0;width:100%;border:1.5px solid var(--ink);background:none;padding:12px;cursor:pointer;font-weight:700}
.more:hover{background:var(--ink);color:var(--bg)}
.empty{padding:40px 0;border-top:3px solid var(--ink);color:var(--muted);font-size:15px}

/* 안내 */
.doc{max-width:74ch;margin:0 auto;padding:30px 28px 70px}
.doc h3{font-size:19px;font-weight:800;margin:32px 0 10px;padding-top:12px;border-top:3px solid var(--ink)}
.doc p,.doc li{font-size:15px;line-height:1.75}
.doc ul{padding-left:20px}
.gl{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:baseline;margin:8px 0;font-size:14.5px}
.gl>b{font-weight:800}
.srcs{width:100%;border-collapse:collapse;font-size:13.5px}
.srcs th,.srcs td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.srcs th{font-weight:800;border-bottom:2px solid var(--ink)}
.srcs td.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}

.credit{border-top:3px solid var(--ink);background:var(--bg2)}
.credit div{max-width:1280px;margin:0 auto;padding:18px 28px calc(18px + env(safe-area-inset-bottom,0px));font-size:14px;font-weight:700;display:flex;align-items:center;gap:10px}
.brand-mini{display:inline-grid;grid-template-columns:repeat(3,4px);gap:2px}
.brand-mini b{width:4px;height:12px;display:block}
@media (max-width:900px){.credit div{padding-left:16px;padding-right:16px}}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

@media (max-width:900px){
  .top,.tabs ul,.band-in,.body,.doc{padding-left:16px;padding-right:16px}
  .band-in{grid-template-columns:minmax(0,1fr);padding-top:22px;padding-bottom:22px}
  .body{grid-template-columns:minmax(0,1fr);gap:14px;padding-top:14px}
  .filters{position:static;gap:0;border:1.5px solid var(--ink)}
  .filters summary{display:flex;justify-content:space-between;padding:10px 12px;font-weight:800;cursor:pointer;list-style:none}
  .filters summary::-webkit-details-marker{display:none}
  .filters summary::after{content:"+";font-weight:900}
  .filters[open] summary::after{content:"−"}
  .filters .fbody{display:flex;flex-direction:column;gap:18px;padding:4px 12px 14px}
  .rec{grid-template-columns:minmax(0,1fr);gap:6px}
  .num{display:flex;gap:6px;align-items:baseline}
  .num b{font-size:18px}
  .text{font-size:16px}
  .flow li{min-width:96px}
}
@media (min-width:901px){.filters .fbody{display:flex;flex-direction:column;gap:20px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

note":"","s":"확률과 통계"},{"n":251,"g":"수학","o":"AP미적분학","j":"원문 명시","y":2022,"yb":"입학 학년도","u":"통계학과 지원 / 합격: 서울대학교 통계학과, 고려대학교 수학과, 포항공과대학교 무은재학부, 경희대학교 수학과","t":"삼각형의 결정조건인 두 변의 길이의 합이 가장 긴 변보다 크다는 사실을 증명함. 접선의 방정식을 이용한 곡선의 선형화를 소개하고 관련 문제를 풀어 친구들의 이해를 도움. 친구들이 어려워한 심슨 공식은 원점 대칭인 두 점과 세 점을 지나는 이차함수를 잡아 대입한 뒤 계수 사이의 관계로 일반형을 유도해 소개함. 원의 성질로 Disk method를 설명해 회전체의 부피를 구하고, y=sinx를 x축으로 회전시킨 부피를 계산함. 단조증가하고 위로 유계인 수열이 수렴함을 극한의 정의로 증명하고, 이것이 교대급수 판정법 증명에 쓰임을 보임.","st":"증명 → 선형화 소개 → 심슨 공식 유도 → 수렴 증명","v":"증명, 소개, 유도, 설명, 계산","r":"친구들이 어려워한 공식을 직접 유도해 가르침","gr":"B","gx":false,"top":"서울대·고려대·경희대·포항공대","src":"충북교육청 「선배들이 만든 대학입학 사례집」","loc":"PDF 370쪽부터, 과목 표의 AP미적분학","url":"https://blog.kakaocdn.net/dn/5Mkrx/btrQU9d3aXJ/b9KOo3Q8k06Zu00dOw0i60/2022.%20%EC%84%A0%EB%B0%B0%EB%93%A4%EC%9D%B4%20%EB%A7%8C%EB%93%A0%20%EB%8C%80%ED%95%99%EC%9E%85%ED%95%99%20%EC%82%AC%EB%A1%80%EC%A7%91%28%EC%B6%A9%EB%B6%81%EA%B5%90%EC%9C%A1%EC%B2%AD%29.pdf?attach=1&knm=tfile.pdf","note":"","s":"AP미적분학"},{"n":252,"g":"수학","o":"AP미적분학","j":"원문 명시","y":2022,"yb":"입학 학년도","u":"수학교육과 지원 / 합격: 서울대학교 수학교육과, 청주교육대학교 초등교육과","t":"정리한 수학 개념 노트를 친구들이 빌려 부교재로 쓸 정도였음. 삼각부등식을 증명했고 Slicing 방법으로 3차원 모형의 부피를 구해 직관적, 논리적 방법으로 소개함. 적분 판정법에서 정적분이 수렴하면 무한급수도 수렴하고 발산하면 함께 발산함을 보이며 정적분 값이 급수의 합은 아니라는 오개념을 바로잡음. 엡실론 델타 방법으로 비 판정법을 증명하고 p-급수 판정법과 함께 쓰는 효과를 보여 줌.","st":"개념 정리 → 증명 소개 → 판정법 설명 → 오개념 교정","v":"정리, 증명, 설명, 소개, 교정","r":"엄밀한 증명과 오개념 교정 설명을 함께 보여 줌","gr":"B","gx":false,"top":"서울대","src":"충북교육청 「선배들이 만든 대학입학 사례집」","loc":"PDF 608쪽부터, 과목 표의 AP미적분학","url":"https://blog.kakaocdn.net/dn/5Mkrx/btrQU9d3aXJ/b9KOo3Q8k06Zu00dOw0i60/2022.%20%EC%84%A0%EB%B0%B0%EB%93%A4%EC%9D%B4%20%EB%A7%8C%EB%93%A0%20%EB%8C%80%ED%95%99%EC%9E%85%ED%95%99%20%EC%82%AC%EB%A1%80%EC%A7%91%28%EC%B6%A9%EB%B6%81%EA%B5%90%EC%9C%A1%EC%B2%AD%29.pdf?attach=1&knm=tfile.pdf","note":"","s":"AP미적분학"},{"n":253,"g":"수학","o":"경제 수학","j":"원문 명시","y":2022,"yb":"입학 학년도","u":"중어중문학과 지원 / 합격: 경희대학교 중국어학과, 한국외국어대학교 중국외교통상학부, 서울시립대학교 중국어문화학과","t":"위안화 절상 뉴스를 보고 우리나라에 미칠 악영향 어로 단어를 연상해 익히는 데 강점을 보였으며, 주제에서 세부로 내려가는 하향식 구조로 본문을 분석함.","st":"질문 해결 → 조별 분석과 도식 요약 → 하향식 독해","v":"질문, 파악, 도식화, 요약, 연상","r":"독해 과정을 구조로 정리하는 전략","gr":"A","gx":false,"top":"서울대","src":"서울대 아로리 「나도 입학사정관」","loc":"학생 A 페이지, 발췌 3번째 문단","url":"https://snuarori.snu.ac.kr/admissions/officer?md=view&year=2025&college=6&department=78&dataidx=802","note":"","s":"영어"},{"n":365,"g":"영어","o":"영어","j":"원문 명시","y":2025,"yb":"입학 학년도","u":"서울대 생활과학대학 소비자아동학부 소비자학전공 학생 B","t":"생소하고 어려운 구문이 있는 지문도 스스로 일목요연하게 정리함. 교사의 피드백에 귀 기울여 더 발전하려 함. 공유경제를 다룬 영어 지문에서 생긴 궁금증으로 원문과 '공유경제는 공유하지 않는다'를 읽고 요약해 해결 방안을 제시, 급우들의 이해를 도움. 모르는 부분은 끝까지 해결함.","st":"지문 정리 → 궁금증과 독서 → 요약과 해결안 제시","v":"정리, 읽기, 요약, 제시, 해결","r":"지문에서 책 읽기로 이어진 확장 학습","gr":"A","gx":false,"top":"서울대","src":"서울대 아로리 「나도 입학사정관」","loc":"학생 B 페이지, 발췌 3번째 문단","url":"https://snuarori.snu.ac.kr/admissions/officer?md=view&year=2025&college=6&department=78&dataidx=803","note":"","s":"영어"},{"n":366,"g":"영어","o":"영어","j":"원문 명시","y":2025,"yb":"입학 학년도","u":"서울대 생활과학대학 소비자아동학부 소비자학전공 학생 C","t":"핵심어로 요약문을 쓰고 학습 주제에 관한 의견을 전하며, 학습 과정을 돌아보고 앞으로의 전략을 세움. 발표를 두려워하다 극복한 경험을 서술 에세이로 써서 형식에 맞게 구성하고 장면과 심정을 생생하게 묘사함. 친구들의 에세이를 읽고 문법 지식으로 비문을 고치고 연결사를 추천함.","st":"핵심어 요약 → 경험 에세이 작성 → 친구 글 교정","v":"요약, 성찰, 작성, 묘사, 교정","r":"자기 경험 글쓰기와 또래 피드백","gr":"A","gx":false,"top":"서울대","src":"서울대 아로리 「나도 입학사정관」","loc":"학생 C 페이지, 발췌 3번째 문단","url":"https://snuarori.snu.ac.kr/admissions/officer?md=view&year=2025&college=6&department=78&dataidx=804","note":"","s":"영어"},{"n":367,"g":"영어","o":"영미 문학 읽기","j":"원문 명시","y":2025,"yb":"자료 학년도","u":"인하대 영어영문학과","t":"재난 소식에서 관심을 얻어 포스트 아포칼립스 장르의 대표작 'The Road'를 원서로 읽음. 극한 상황에서 부자의 심정을 추론하고 제목이 생존의 길과 아버지의 죽음을 넘어선 아들의 길을 함께 뜻한다고 해석함.","st":"시사 관심 → 장르 선택 → 원서 정독 → 제목 해석","v":"독서, 추론, 해석","r":"작품 선택 이유와 제목 상징 해석이 구체적인 독서 기록","gr":"C","gx":false,"top":"","src":"인하대 2025 학생부종합전형 가이드북","loc":"PDF 14쪽","url":"https://admission.inha.ac.kr/ajaxfile/CMN_SVC/FileView.do?GBN=X09_1&SITE_NO=2&BROCHURE_SEQ=44","note":"가이드북이 일부 내용을 첨삭했다고 안내.","s":"영미 문학 읽기"},{"n":368,"g":"영어","o":"영어","j":"원문 명시","y":2025,"yb":"자료 학년도","u":"한양대 ERICA 컴퓨터학부(지원)","t":"조별 활동에서 리더를 맡아 아는 내용을 동료와 나눔. 진로 보고서에서 자신의 성격을 소개하며 to 부정사와 동명사로 이유를 설명했고, 진로 탐색 검사와 성격 유형 분석으로 적합한 직업을 찾아 게임 프로그래머 보고서를 작성함. 코로나19로 게임 수요가 늘었다고 짚고 가상 현실과 증강 현실 게임의 등장을 예측했으며, 최신 동향 파악과 C언어 학습 계획을 밝힘. 협동 사례 소개하기에서 게임 스토리 속 세대 간 협동을 영작해 육하원칙과 연결사로 시간순 전개하고, 사진 자료와 제스처를 곁들여 발표함.","st":"조별 리더 → 진로 보고서 → 협동 사례 영작과 발표","v":"설명, 탐색, 작성, 예측, 영작, 발표","r":"배운 문법을 진로 주제 글쓰기에 적용한 점","gr":"C","gx":false,"top":"","src":"한양대 ERICA 2025 학생부종합전형 가이드북","loc":"PDF 10쪽","url":"https://goerica.hanyang.ac.kr/upload/GUIDES/2025_guidebook.pdf","note":"","s":"영어"},{"n":369,"g":"영어","o":"영어Ⅰ","j":"원문 명시","y":2025,"yb":"자료 학년도","u":"동국대 사회복지학과","t":"다섯 가지 문장 형식으로 단락 글을 논리 있게 씀. 관계대명사가 전치사와 쓰일 때 관계부사로 바꿀 수 있는 조건을 교과서 밖 자료로 탐구함.","st":"문장 형식 활용 글쓰기 → 교재 밖 문법 자료 탐구 → 변환 조건 규명","v":"표현, 사용, 탐구","r":"글쓰기 능력에 그치지 않고 관계사 변환 조건이라는 구체 문법 주제를 파고든 점","gr":"C","gx":false,"top":"동국대","src":"동국대 2025 학생부위주전형 가이드북","loc":"PDF 31쪽","url":"https://ipsi.dongguk.edu/upload/file/20240227133554R34L65.PDF","note":"가이드북이 일부 내용을 첨삭했다고 안내.","s":"영어Ⅰ"},{"n":370,"g":"영어","o":"영어","j":"원문 명시","y":2025,"yb":"게시 연도","u":null,"t":"원서교재 속 소논문에서 카페인 음료가 위험하다는 내용을 읽고 각성 기전이 궁금해 학술 데이터베이스에서 자료를 직접 찾음. 아데노신 수용체와 타우린 등 관련 물질을 알게 되어 시판 에너지 음료를 조사함. 인포그래픽 지문을 분석해 발표하며 색상과 급간을 활용한 데이터 전달법을 익혀 급우들에게 카페인 음료 자료를 공유함. 로그 변환과 기술통계 같은 용어를 설명하려 영어 통계책을 찾아보고 교과 교사에게 질문함.","st":"소논문 독해 → 자료 탐색과 음료 조사 → 인포그래픽 발표 → 통계 용어 학습","v":"독해, 탐색, 조사, 분석, 발표, 질문","r":"읽기 자료를 계기로 자료를 직접 찾고 타 분야로 확장함","gr":"D","gx":false,"top":"","src":"명문대 합격생의 '영어' 세특 사례","loc":"글 본문","url":"https://blog.naver.com/PostView.naver?blogId=doshin38&logNo=223864274684","note":"","s":"영어"},{"n":371,"g":"영어","o":"영어","j":"원문 명시","y":2025,"yb":"게시 연도","u":null,"t":"접두사를 활용해 단어를 더 알려 주며 멘티의 독해를 도움. 로봇 공학 단원의 AR 기술을 소논문으로 써서 피드백을 요청함.","st":"접두사 활용 어휘 지도 → 소논문 작성 → 피드백 요청","v":"제공, 지도, 작성, 요청","r":"또래 멘토링과 글쓰기 피드백 요청이 함께 드러남","gr":"D","gx":false,"top":"","src":"명문대 합격생의 '영어' , 연결, 확장","r":"국제 뉴스를 지리·경제 개념으로 해석","gr":"A","gx":false,"top":"서울대","src":"서울대 아로리 「나도 입학사정관」","loc":"학생 A 페이지, 발췌 3번째 문단","url":"https://snuarori.snu.ac.kr/admissions/officer?md=view&year=2026&college=9&dataidx=810","note":"","s":"세계지리"},{"n":489,"g":"사회","o":"세계지리","j":"내용 추정","y":2026,"yb":"입학 학년도","u":"서울대 경영대학 학생 C","t":"세 나라의 문화와 지리 특징을 조사해 전통춤과 의상, 모스크, 소금광산을 핵심 문구와 이미지로 구성함. 일본 유적지를 비교해 기록하고, 랜드마크와 음식, 관광, 산업의 키워드 20개 이상을 이미지와 함께 한 장의 지도로 만듦.","st":"문화 카드 제작 → 유적 비교 기록 → 키워드 지도 제작","v":"조사, 구성, 비교, 기록","r":"조사 내용을 시각 자료로 재구성","gr":"A","gx":false,"top":"서울대","src":"서울대 아로리 「나도 입학사정관」","loc":"학생 C 페이지, 발췌 5번째 문단","url":"https://snuarori.snu.ac.kr/admissions/officer?md=view&year=2026&college=9&dataidx=808","note":"","s":"세계지리"},{"n":490,"g":"사회","o":"정치와 법","j":"내용 추정","y":2026,"yb":"입학 학년도","u":"서울대 경영대학 학생 A","t":"사회복무요원 처우에 관한 판례를 평등권, 행복추구권 등의 시각으로 분석하고 현역병과 복무 특성을 견주어 차별의 정당성을 따짐. 의대 입학정원 정책은 지역별 의료 여건과 전문가 의견을 조사한 뒤 지방 기반이 부족함을 들어 점진적 확대안을 냄.","st":"판례 분석 → 정책 조사 → 점진적 대안 제시","v":"분석, 비교, 조사, 제시","r":"판례 분석과 정책 대안 제시를 모두 수행","gr":"A","gx":false,"top":"서울대","src":"서울대 아로리 「나도 입학사정관」","loc":"학생 A 페이지, 발췌 4번째 문단","url":"https://snuarori.snu.ac.kr/admissions/officer?md=view&year=2026&college=9&dataidx=810","note":"","s":"정치와 법"},{"n":491,"g":"사회","o":"통합사회","j":"내용 추정","y":2026,"yb":"입학 학년도","u":"서울대 사회과학대학 언론정보학과 학생 A","t":"소년병 문제에 대한 국제사회의 대응을 법률과 국제기구로 나눠 조사함. 배리어프리 영화가 적다는 통계로 장애인의 문화권 문제를 제기하며 이동권까지 고려한 대책을 제안하고, 지역 축제의 바가지요금 해결 방안도 제시함.","st":"국제 대응 조사 → 통계로 문제 제기 → 축제 스크랩과 해결안","v":"조사, 제기, 제안, 제시","r":"통계를 근거로 문제를 세우고 해외 사례와 대안까지 연결","gr":"A","gx":false,"top":"서울대","src":"서울대 아로리 「나도 입학사정관」","loc":"학생 A 페이지, 발췌 3번째 문단","url":"https://snuarori.snu.ac.kr/admissions/officer?md=view&year=2026&college=3&department=25&dataidx=816","note":"","s":"통합사회"},{"n":492,"g":"사회","o":"통합사회","j":"내용 추정","y":2026,"yb":"입학 학년도","u":"서울대 경영대학 학생 A","t":"세계적 금융 도시를 소개하는 팜플렛에서 금융, 회계 산업의 성장 배경을 분석해 우리나라의 발전 방향을 제시하고 공정무역 활성화 방안을 구상함. 문화 상대주의의 의의와 극단화의 위험을 사례로 설명하며 보편적 가치로 "사회·문화"},{"n":527,"g":"사회","o":"정치와법","j":"원문 명시","y":2024,"yb":"자료 학년도","u":"경희대 국제학과","t":"현대 민주주의의 위기를 주제로 대중 지지에 기댄 정치가 포퓰리즘으로 흐를 위험과 그 경제적 폐해를 사례로 제시하고 시민의 성찰이 필요함을 강조함. 부패 방지 법의 한계와 공적개발원조의 관계를 보고서로 다루며 부패가 원조 효과를 떨어뜨림을 밝히고 전자정부 구축을 대안으로 도출함.","st":"위기 주제 → 사례 제시 → 보고서 분석 → 대안 도출","v":"제시, 강조, 작성, 도출","r":"문제와 사례를 제시하고 구체적 대안까지 도출한 구조","gr":"C","gx":false,"top":"경희대","src":"경희대 2024 학생부전형 가이드북","loc":"PDF 24쪽","url":"https://kr.object.gov-ncloudstorage.com/khuiphakstorage/upload/20230530110102784_2024%20%ED%95%99%EC%83%9D%EB%B6%80%EC%A0%84%ED%98%95%20%EA%B0%80%EC%9D%B4%EB%93%9C%EB%B6%81-compressed.pdf","note":"","s":"정치와 법"},{"n":528,"g":"사회","o":"국제 정세 주제탐구","j":"내용 추정","y":2023,"yb":"입학 학년도","u":"서울대 인문대학 역사학부 학생 B","t":"주제탐구 프로젝트에서 러시아와 우크라이나 전쟁이 미국과 중국의 패권 구도에 주는 영향을 보고서로 작성함. 신냉전을 가치와 정치체제가 맞서는 구조로 정의하고, 이 전쟁이 신냉전이 드러난 사건인 이유를 풀어 씀. 인도태평양 전략과 일대일로를 근거로 두 나라 경쟁이 깊어지며 갈등의 중심이 대만이 되리라 전망함. 동력이 약해질 때 한미일과 북중러 사이에 맞대결 양상이 되살아날 수 있다고 보고 남한의 외교 전략을 제안함.","st":"주제 설정 → 개념 재정의 → 양국 전략 비교와 제언","v":"작성, 정의, 제시, 전망","r":"시사 사건을 개념화하고 시간 흐름에서 전망까지 제시","gr":"A","gx":false,"top":"서울대","src":"서울대 아로리 「나도 입학사정관」","loc":"학생 B 페이지, 발췌 2번째 문단","url":"https://snuarori.snu.ac.kr/admissions/officer?md=view&year=2023&college=1&department=119&dataidx=733","note":"","s":"국제 정세 주제탐구"},{"n":529,"g":"사회","o":"사회·문화","j":"내용 추정","y":2023,"yb":"입학 학년도","u":"서울대 사회과학대학 심리학과 학생 C","t":"'능력주의는 바람직한가' 반대 측으로, 게으름 탓 빈곤론을 매슬로의 욕구이론으로 반박함. 하위 욕구 결핍 시 자아실현이 어렵다고 보강함.","st":"토론 입장 → 이론 근거 → 논지 강화","v":"토론, 반박, 보강","r":"심리학 이론을 근거로 상대 논지를 논리적으로 반박","gr":"A","gx":false,"top":"서울대","src":"서울대 아로리 「나도 입학사정관」","loc":"학생 C 페이지, 발췌 2번째 문단","url":"https://snuarori.snu.ac.kr/admissions/officer?md=view&year=2023&college=3&department=22&dataidx=737","note":"","s":"사회·문화"},{"n":530,"g":"사회","o":"사회·문화","j":"내용 추정","y":2023,"yb":"입학 학년도","u":"서울대 인문대학 역사학부 학생 B","t":"기사 속 높은 상대적 빈곤율의 원인이 노인 빈곤에 있다는 내용을 배운 빈곤 개념에 비추어 객관적으로 풀이함. 노인 빈곤과 저출산이 계속되면 생길 문제를 비판적으로 내다보고, 앞으로 복지 제도가 택할 방향을 근거를 들어 제안함. 경제, 복지, 세대 등 여러 ,"t":"일일교사로 경제 퀴즈 수업을 열어 규칙이 모호할 때 중재함. 원격 수업 중 한국 경제성장 과정을 조사해 2007년 금융 위기 후 정부의 대처를 살피고, 정부 개입 논쟁에서 케인즈와 프리드먼 주장을 비교해 정부지출 확대의 효과와 구축효과를 정리함. 모의 주식투자에서 주식을 예금, 채권과 견주어 분석하고, 사회적경제 프로젝트에서 협력 곤란 상황을 역할극으로 풀어 발표한 뒤 실제 사회적 기업의 사회적, 경제적 가치를 조사해 발표함.","st":"퀴즈 수업 → 경제 조사 → 모의 투자 → 사회적 기업 발표","v":"진행, 중재, 조사, 비교, 발표","r":"가르치는 입장에서 설계하고 투자 체험을 개념과 이었음","gr":"B","gx":false,"top":"건국대·동국대","src":"충북교육청 「선배들이 만든 대학입학 사례집」","loc":"PDF 76쪽부터, 과목 표의 경제","url":"https://blog.kakaocdn.net/dn/5Mkrx/btrQU9d3aXJ/b9KOo3Q8k06Zu00dOw0i60/2022.%20%EC%84%A0%EB%B0%B0%EB%93%A4%EC%9D%B4%20%EB%A7%8C%EB%93%A0%20%EB%8C%80%ED%95%99%EC%9E%85%ED%95%99%20%EC%82%AC%EB%A1%80%EC%A7%91%28%EC%B6%A9%EB%B6%81%EA%B5%90%EC%9C%A1%EC%B2%AD%29.pdf?attach=1&knm=tfile.pdf","note":"","s":"경제"},{"n":546,"g":"사회","o":"경제","j":"원문 명시","y":2022,"yb":"입학 학년도","u":"경제학과 지원 / 합격: 건국대학교 경제학과, 인하대학교 경제학과, 단국대학교 경제학과, 충북대학교 경제학과","t":"일일교사로 학습지 수업을 진행하며 비합리적 소비를 겪은 친구의 발표를 바탕으로 합리적 소비가 늘 들어맞지는 않음을 짚음. 원격 수업 중 GDP디플레이터 통계를 분석해 디플레이션 발생을 조사하고, 정부 개입 논쟁에서 케인즈와 프리드먼의 주장을 비교함.","st":"일일교사 수업 → 통계 분석 → 학설 비교","v":"진행, 분석, 조사, 비교, 작성","r":"가르치는 활동과 통계 분석, 학설 비교가 한 과목에 공존함","gr":"B","gx":false,"top":"건국대","src":"충북교육청 「선배들이 만든 대학입학 사례집」","loc":"PDF 127쪽부터, 과목 표의 경제","url":"https://blog.kakaocdn.net/dn/5Mkrx/btrQU9d3aXJ/b9KOo3Q8k06Zu00dOw0i60/2022.%20%EC%84%A0%EB%B0%B0%EB%93%A4%EC%9D%B4%20%EB%A7%8C%EB%93%A0%20%EB%8C%80%ED%95%99%EC%9E%85%ED%95%99%20%EC%82%AC%EB%A1%80%EC%A7%91%28%EC%B6%A9%EB%B6%81%EA%B5%90%EC%9C%A1%EC%B2%AD%29.pdf?attach=1&knm=tfile.pdf","note":"","s":"경제"},{"n":547,"g":"사회","o":"경제","j":"원문 명시","y":2022,"yb":"입학 학년도","u":"정보통신공학과 지원 / 합격: 세명대학교 컴퓨터학부, 강원대학교 전자정보통신학과, 강릉원주대 정보통신학과","t":"고용률과 실업률을 배운 뒤 청년 실업 문제를 탐구함. 국민취업지원제도 광고를 계기로 취업 기사를 모으고 관련 제도와 법의 장단점을 비교함. 청년고용할당제처럼 지속 가능한 일자리 정책이 장기적, 구조적 전략과 함께 시행되어야 한다고 정리함. 코로나19 고용난은 노동 공급뿐 아니라 수요 측면에서도 풀어야 한다고 강조하고, 시민 의견을 수집해 자기 생각과 견주는 후속 활동을 계획함.","st":"기사 수집 → 제도 비교 → 정책 제안 → 후속 계획","v":"수집, 비교, 정리, 강조, 계획","r":"수업 개념에서 출발해 제도 비교와 후속 계획까지 이어짐","gr":"B","gx":false,"t &dataidx=715","note":"","s":"물리학Ⅰ"},{"n":740,"g":"물리","o":"고급 물리학","j":"원문 명시","y":2022,"yb":"입학 학년도","u":"데이터과학과 지원 / 합격: 연세대학교 기계공학과, 포항공과대학교 무은재학과, 한양대학교 데이터사이언스학과, 성균관대학교 소프트웨어학","t":"던진 부메랑이 제자리로 오는 현상을 받음각에서 생기는 양력으로 풀어내고, 이를 더 깊이 공부해 온라인 수업에서 발표함. 자이로스코프의 세차운동을 근거로 회전축이 변하면서 휘는 방향을 예측하는 방식을 설명했으며, 강체가 자전을 이어 가려는 성질인 관성모멘트로 각운동량 보존과 회전운동을 해석함. 구름운동까지 포함하는 에너지 보존법칙을 증명할 실험을 설계하고 예비보고서를 써서 역학적 에너지 보존을 폭넓게 이해함.","st":"부메랑 원리 발표 → 세차운동 설명 → 실험 설계","v":"설명, 발표, 예측, 설계, 작성","r":"일상 사물을 물리 법칙으로 풀고 실험 설계까지 함","gr":"B","gx":false,"top":"연세대·성균관대·한양대·포항공대","src":"충북교육청 「선배들이 만든 대학입학 사례집」","loc":"PDF 381쪽부터, 과목 표의 고급 물리학","url":"https://blog.kakaocdn.net/dn/5Mkrx/btrQU9d3aXJ/b9KOo3Q8k06Zu00dOw0i60/2022.%20%EC%84%A0%EB%B0%B0%EB%93%A4%EC%9D%B4%20%EB%A7%8C%EB%93%A0%20%EB%8C%80%ED%95%99%EC%9E%85%ED%95%99%20%EC%82%AC%EB%A1%80%EC%A7%91%28%EC%B6%A9%EB%B6%81%EA%B5%90%EC%9C%A1%EC%B2%AD%29.pdf?attach=1&knm=tfile.pdf","note":"","s":"고급 물리학"},{"n":741,"g":"물리","o":"물리학","j":"원문 명시","y":2022,"yb":"입학 학년도","u":"데이터과학과 지원 / 합격: 연세대학교 기계공학과, 포항공과대학교 무은재학과, 한양대학교 데이터사이언스학과, 성균관대학교 소프트웨어학","t":"한 해 동안 물리 도우미를 맡아 수업에 성실히 임함. 거대과학과 펨토과학에서 과학자가 맡는 역할을 정리하며, 거대과학이 대규모 이익집단으로 바뀔 수 있고 이해관계자가 많아 문제가 생긴다고 짚음. 로봇공학자라는 진로를 바탕으로 과학기술이 앞서가는 사회에서 정치 지도자와 과학자가 맡을 책임을 설득하는 글을 썼음. 감마선으로 결석을 없애는 기술을 접하고 감마나이프 수술의 원리와 활용을 조사해 보고서로 정리했으며, 'B. 잭 코플랜드'가 쓴 컴퓨터와 정보 시대의 개척자를 다룬 책을 읽고 에니그마를 물리적으로 푸는 방법을 보고서에 담음.","st":"역할 정리 → 독서 후 보고서 → 신기술 발표 → 의료 응용 조사","v":"정리, 지적, 작성, 조사, 발표","r":"진로인 로봇공학과 연결한 보고서가 여러 형태로 나타남","gr":"B","gx":false,"top":"연세대·성균관대·한양대·포항공대","src":"충북교육청 「선배들이 만든 대학입학 사례집」","loc":"PDF 381쪽부터, 과목 표의 물리학","url":"https://blog.kakaocdn.net/dn/5Mkrx/btrQU9d3aXJ/b9KOo3Q8k06Zu00dOw0i60/2022.%20%EC%84%A0%EB%B0%B0%EB%93%A4%EC%9D%B4%20%EB%A7%8C%EB%93%A0%20%EB%8C%80%ED%95%99%EC%9E%85%ED%95%99%20%EC%82%AC%EB%A1%80%EC%A7%91%28%EC%B6%A9%EB%B6%81%EA%B5%90%EC%9C%A1%EC%B2%AD%29.pdf?attach=1&knm=tfile.pdf","note":"","s":"물리학"},{"n":742,"g":"물리","o":"물리학 실험","j":"원문 명시","y":2022,"yb":"입학 학년도","u":"전자공학과 지원 / 합격: 국민대학교 전자공학부, 광운대학교 전자공학과","t":"모둠실험에서 협력하며 스털링 기관의 장단점과 사용 사례를 미리 조사해 발표하고 직접 만들어 보겠다는 뜻을 밝힘. 다이오드를 연결해 순방향 바이어스 방향을 찾았고, 반도체를 추가로 조사해 실리콘을 쓰고 빛으로 회로를 축소해 쌓는 기술이 진로인 로봇 분야에서 중요하다는 보고서를 작성함. 용수철을 직렬과 병렬로 연결해 상수값을 측정하고 합성 상수를 구하는 식을 유도했으며, 등전위 실험에서 등전위선을 그리고 등전위 본딩을 조사해 보고서를 씀. 운동량보존 실험을 조건에 따라 비교하고 일상 속 예시를 찾아 발표함.","st":"기관 조사 → 반도체 보고서 → 용수철과 등전위 실험","v":"조사, 측정, 유도, 작성, 비교, 발표","r":"여러 실험을 진로 관심과 이어 보고서와 식 유도로 마무리함","gr":"B","gx":false,"top":"","src":"충북교육청 「선배들이 만든 대학입학 사례집」","loc":"PDF 451쪽부터, 과목 표의 물리학 실험","url":"https://blog.kakaocdn.net/dn/5Mkrx/btrQU9d3aXJ/b9KOo3Q8k06Zu00dOw0i60/2022.%20%EC%84%A0%EB%B0%B0%EB%93%A4%EC%9D%B4%20%EB%A7%8C%EB%93%A0%20%EB%8C%80%ED%95%99%EC%9E%85%ED%95%99%20%EC%82%AC%EB%A1%80%EC%A7%91%28%EC%B6%A9%EB%B6%81%EA%B5%90%EC%9C%A1%EC%B2%AD%29.pdf?attach=1&knm=tfile.pdf","note":"","s":"물리학 실험"},{"n":743,"g":"물리","o":"물리학1","j":"원문 명시","y":2022,"yb":"입학 학년도","u":"간호학과 지원 / 합격: 건국대학교 글로컬, 순천향대학교 간호학과, 충남대학교 간호학과, 건양대학교 간호학과","t":"과학글쓰기에서 거대과학을 조사하며 협업의 중요성을 알고 과학자의 직업윤리를 글로 정리함. 상대성이론이 SF 영화에 준 영향을 과학 기사로 쓰고, 시간 지연이 궁금해 '시간은 흐르지 않는다'를 읽어 의문을 풀음. 원자 모형 실험에 관심을 두고 '핵물리학과 러더퍼드'를 읽어 러더퍼드의 생애와 방사선 연구를 보고서에 담음. 신기술 연구포럼에서는 반도체 신기술과 의료의 연관성을 주제로 보고서를 쓰다 신축성 전자피부를 알게 되어 활용 분야를 살핌.","st":"글쓰기 → 기사 → 도서 보고서 → 포럼 보고서","v":"조사, 작성, 독서, 정리, 보고","r":"관심 주제를 기사와 보고서로 나눠 표현함","gr":"B","gx":false,"top":"","src":"충북교육청 「선배들이 만든 대학입학 사례집」","loc":"PDF 240쪽부터, 과목 표의 물리학1","url":"https://blog.kakaocdn.net/dn/5Mkrx/btrQU9d3aXJ/b9KOo3Q8k06Zu00dOw0i60/2022.%20%EC%84%A0%EB%B0%B0%EB%93%A4%EC%9D%B4%20%EB%A7%8C%EB%93%A0%20%EB%8C%80%ED%95%99%EC%9E%85%ED%95%99%20%EC%82%AC%EB%A1%80%EC%A7%91%28%EC%B6%A9%EB%B6%81%EA%B5%90%EC%9C%A1%EC%B2%AD%29.pdf?attach=1&knm=tfile.pdf","note":"","s":"물리학Ⅰ"},{"n":744,"g":"물리","o":"물리학1","j":"원문 명시","y":2022,"yb":"입학 학년도","u":"화공생명공학과 지원 / 합격: 가톨릭대학교 바이오메디컬화학공학과","t":"글쓰기 활동으로 펨토 과학기술을 조사하다 인간복제와 바이오테러 관련 논문을 읽고 과학자에게 필요한 윤리적 판단을 정리했으며, 동물 임상실험을 대체하는 방법으로 탐구를 넓힘. 신문 기사 쓰기에서는 상대성이론이 영화, GPS의 정확성, 미술에 끼친 영향을 쓰고 미술 부분에는 작품 삽화를 넣음. 헤르츠의 생애와 업적을 조 11&department=41&dataidx=707","note":"","s":"지구과학Ⅰ"},{"n":898,"g":"지구과학","o":"지구과학Ⅰ","j":"내용 추정","y":2022,"yb":"입학 학년도","u":"서울대 공과대학 화학생물공학부 학생 C","t":"원리를 다루는 수업을 거치며 지구과학이 딱딱하다는 생각이 달라졌다고 발표함. 수업 직후 판서를 놓고 친구들과 의견을 나누며, 질문에는 스스로 답에 닿도록 이끎. 연대측정과 수소 핵융합을 더 공부하려 함.","st":"수업 소감 발표 → 친구와 정리 → 심화 학습 계획","v":"발표, 정리, 안내, 심화","r":"친구 안내 방식과 후속 심화 의지가 드러남","gr":"A","gx":false,"top":"서울대","src":"서울대 아로리 「나도 입학사정관」","loc":"학생 C 페이지, 발췌 5번째 문단","url":"https://snuarori.snu.ac.kr/admissions/officer?md=view&year=2022&college=11&department=41&dataidx=709","note":"","s":"지구과학Ⅰ"},{"n":899,"g":"지구과학","o":"지구2","j":"원문 명시","y":2022,"yb":"입학 학년도","u":"스포츠과학과 지원 / 합격: 가천대학교(메디컬) 운동재활복지학과, 광운대학교 스포츠융합과학과, 건양대 스포츠","t":"수업 중 끊임없이 질문하며 분위기를 이끎. 비가 오기 전에 무릎이 시린 이유를 탐구하려고 질문노트를 작성함. 강수가 상승기류를 전제로 한다는 점을 핵심으로 짚고, 상승기류로 지표 기압이 낮아지면 상대적으로 관절 내 압력이 높아져 조직이 팽창하고 주변 신경을 건드려 시림이 생긴다고 분석했으며, 증상 완화 방법까지 적어 제출함. 모둠 지질명소 가이드 활동에서는 자료조사와 내용정리를 맡아 소금사막의 지구과학적 특징을 정리함.","st":"질문 → 강수 원리 분석 → 모둠 활동","v":"질문, 분석, 작성, 정리","r":"일상 현상을 지구과학 원리로 풀고 대처법까지 제시함","gr":"B","gx":false,"top":"","src":"충북교육청 「선배들이 만든 대학입학 사례집」","loc":"PDF 461쪽부터, 과목 표의 지구2","url":"https://blog.kakaocdn.net/dn/5Mkrx/btrQU9d3aXJ/b9KOo3Q8k06Zu00dOw0i60/2022.%20%EC%84%A0%EB%B0%B0%EB%93%A4%EC%9D%B4%20%EB%A7%8C%EB%93%A0%20%EB%8C%80%ED%95%99%EC%9E%85%ED%95%99%20%EC%82%AC%EB%A1%80%EC%A7%91%28%EC%B6%A9%EB%B6%81%EA%B5%90%EC%9C%A1%EC%B2%AD%29.pdf?attach=1&knm=tfile.pdf","note":"","s":"지구과학Ⅱ"},{"n":900,"g":"지구과학","o":"지구과학","j":"원문 명시","y":2022,"yb":"입학 학년도","u":"생명과학과 지원 / 합격: 단국대학교 생명과학과","t":"복습용 지구과학 노트를 직접 만들어 수업 내용을 알기 쉽게 정리함. 기상 이변에 호기심을 갖고 엘니뇨를 조사해 그림 자료를 넣은 발표 자료로 친구들 앞에서 설명했으며, 동태평양과 서태평양에 미치는 영향을 평상시, 엘니뇨, 라니냐를 비교해 풀어냄. 기후 변화 속도를 늦출 방법을 찾으려 '두 번째 지구는 없다'를 읽고 기록함.","st":"노트 정리 → 엘니뇨 조사 발표 → 비교 설명 → 독서","v":"정리, 조사, 제작, 설명, 비교, 독서","r":"기상 이변 의문을 자료 제작과 비교 설명으로 풀어냄","gr":"B","gx":false,"top":"","src":"충북교육청 「선배들이 만든 대학입학 사례집」","loc":"PDF 330쪽부터, 과목 표의 지구과학","url":"https://blog.kakaocdn.net/dn/5Mkrx/btrQU9d3aXJ/b9KOo3Q8k06Zu00dOw0i60/2 반사로 눈부심을 줄이고, 입자가 굵은 화강암이 배수를 도와 폭우에 대비한다는 점을 사진과 함께 설명함. 과학사 융합 수업의 하버 암모니아 합성법 프로젝트를 이어 '공기의 연금술'(토머스 헤이거)을 읽고 두 과학자의 삶과 과학기술의 양면성을 정리함.","st":"주제 선정 → 원리 분석 → 사진 설명 → 독서 확장","v":"분석, 설명, 발표, 읽기, 정리","r":"문화유산을 과학 원리로 풀고 독서로 사회적 시각을 넓힘","gr":"B","gx":false,"top":"서울대·연세대·고려대·성균관대","src":"충북교육청 「선배들이 만든 대학입학 사례집」","loc":"PDF 581쪽부터, 과목 표의 생활과과학","url":"https://blog.kakaocdn.net/dn/5Mkrx/btrQU9d3aXJ/b9KOo3Q8k06Zu00dOw0i60/2022.%20%EC%84%A0%EB%B0%B0%EB%93%A4%EC%9D%B4%20%EB%A7%8C%EB%93%A0%20%EB%8C%80%ED%95%99%EC%9E%85%ED%95%99%20%EC%82%AC%EB%A1%80%EC%A7%91%28%EC%B6%A9%EB%B6%81%EA%B5%90%EC%9C%A1%EC%B2%AD%29.pdf?attach=1&knm=tfile.pdf","note":"","s":"생활과 과학"},{"n":942,"g":"통합과학·탐구","o":"융합과학","j":"원문 명시","y":2022,"yb":"입학 학년도","u":"지구환경과학과 지원 / 합격: 부산대학교 지질환경과학과, 경북대학교 지구시스템과학부","t":"과학 함께 읽기에서 '랩걸'을 읽고 과학과 함께하는 삶에 가장 필요한 것은 실패를 딛고 일어설 용기라고 답하며, 현재의 과학 지식이 잘못된 가설과 실패한 실험을 거쳐 세워졌다고 풀이함. 온라인 탐구 수업에서 오존이 자외선을 막는 원리를 조사해 산소의 광분해와 결합으로 오존이 생성되고 분해되는 채프먼 순환을 이해했고, 산소의 원자가전자와 반응성을 근거로 다양한 화학결합이 가능함을 설명함. 에너지와 환경 단원에서는 열점의 지열로 전기를 만들 수 있는지 의문을 세워 지열발전의 장단점과 종류, 비화산지대 발전 가능성을 조사해 제시함.","st":"독서 → 원리 조사 → 의문 제시와 조사","v":"독서, 조사, 이해, 설명, 제시","r":"스스로 던진 질문에서 출발해 화학적 근거로 답을 정리함","gr":"B","gx":false,"top":"","src":"충북교육청 「선배들이 만든 대학입학 사례집」","loc":"PDF 427쪽부터, 과목 표의 융합과학","url":"https://blog.kakaocdn.net/dn/5Mkrx/btrQU9d3aXJ/b9KOo3Q8k06Zu00dOw0i60/2022.%20%EC%84%A0%EB%B0%B0%EB%93%A4%EC%9D%B4%20%EB%A7%8C%EB%93%A0%20%EB%8C%80%ED%95%99%EC%9E%85%ED%95%99%20%EC%82%AC%EB%A1%80%EC%A7%91%28%EC%B6%A9%EB%B6%81%EA%B5%90%EC%9C%A1%EC%B2%AD%29.pdf?attach=1&knm=tfile.pdf","note":"","s":"융합과학"},{"n":943,"g":"통합과학·탐구","o":"융합과학탐구","j":"원문 명시","y":2022,"yb":"입학 학년도","u":"간호학과 지원 / 합격: 중앙대학교 간호학과(자연)","t":"유산균이 잘 자라는 환경을 찾으려 우유에 분말을 넣고 우유의 온도와 종류, 공기 접촉 여부를 바꿔 가며 실험함. 균의 증식은 pH 변화로 가늠하고 화학 시간의 중화적정을 적용함. 반복 과정에서 변인이 통제되지 않으면 오차가 생김을 겪었고, 산의 종류마다 중화점이 달라 알맞은 지시약이 필요한 이유를 배움. 과산화수소를 분해하는 카탈레이스를 확인하려 감자즙 묻힌 거름종이가 산소로 떠오르는 시간을 재는 실험을 설계했으며, 실온과 pH7에서 활성이 가장 크다는 결과를 얻음.","st":"변인 설계 → 반복 실험과 오차 경험 → 효소 실험", op":"","src":"한양대 ERICA 2025 학생부종합전형 가이드북","loc":"PDF 11쪽","url":"https://goerica.hanyang.ac.kr/upload/GUIDES/2025_guidebook.pdf","note":"","s":"응용 프로그래밍 개발"},{"n":967,"g":"정보","o":"인공지능과 미래사회","j":"원문 명시","y":2025,"yb":"자료 학년도","u":"한양대 ERICA 컴퓨터학부(지원)","t":"해외 취업 통계를 주제로 분석 프로젝트를 하며 공공데이터 포털의 한국인 취업 인원 자료를 시각화해 나라별 취업 적합성을 가늠함. 연도별 항목을 견주는 데 꺾은선 그래프가 막대형보다 낫다고 설명하고, y축 오류의 원인이 문자형 데이터였음을 찾아 정수형으로 변환해 고침. 게임 인공지능의 의사결정을 심화 탐구하며 행동트리의 한계와 효용이론 적용 결과를 알아보고, 게임사별 에이전트가 달라 호환이 어렵다는 이유로 실용성이 낮다고 봄. 자율주행 토의에서는 상용화 전에 법, 윤리, 비용, 오작동 문제를 따져야 한다고 발언함.","st":"데이터 시각화 → 오류 수정 → 게임 AI 탐구 → 자율주행 토의","v":"분석, 시각화, 수정, 조사, 설명, 토의","r":"기획부터 데이터 선별·시각화·디버깅까지 과정이 서술됨","gr":"C","gx":false,"top":"","src":"한양대 ERICA 2025 학생부종합전형 가이드북","loc":"PDF 11쪽","url":"https://goerica.hanyang.ac.kr/upload/GUIDES/2025_guidebook.pdf","note":"","s":"인공지능과 미래사회"},{"n":968,"g":"정보","o":"정보","j":"원문 명시","y":2025,"yb":"자료 학년도","u":"한양대 ERICA 컴퓨터학부(지원)","t":"프로그래밍 실습에서 다른 학생의 버그 해결을 도움. 사례 조사 발표에서 '프로그래머'를 주제로 빅데이터와 인공지능 기술의 장단점을 정리하고 정보윤리 문제를 깊이 다룸. 추가로 '프로그래밍 언어의 역사와 원리'를 탐구해 기계어와 어셈블리어 등을 바탕으로 컴퓨터가 언어를 이해하는 원리를 분석하고 쉽게 설명함. 파이썬 문제 풀이에서 문법을 활용해 산출물을 만들고 소스코드의 실행 결과를 예측함. '세상을 만드는 글자, 코딩'을 읽고 요약 발표함.","st":"실습 지원 → 조사 발표 → 언어 원리 탐구 → 파이썬 → 독서","v":"조사, 발표, 분석, 설명, 제작, 예측","r":"주제 조사 후 추가 활동으로 심화하고 실습 산출물도 제작함","gr":"C","gx":false,"top":"","src":"한양대 ERICA 2025 학생부종합전형 가이드북","loc":"PDF 10쪽","url":"https://goerica.hanyang.ac.kr/upload/GUIDES/2025_guidebook.pdf","note":"","s":"정보"},{"n":969,"g":"정보","o":"정보","j":"내용 추정","y":2024,"yb":"입학 학년도","u":"서울대 첨단융합학부 학생 C","t":"친구 두 명과 '빅 데이터의 문제점과 해결방안'을 공동 탐구함. 프리즘을 통한 개인정보 수집, 구매 품목 분석으로 만든 임산부 할인 쿠폰, 포털 메신저의 사이버 검열 사례를 열거하고, 해결 방안으로 익명화 기반 비식별화, 가명 처리, 데이터 삭제, 마스킹을 제안함. 개인정보 유출만 해결되면 빅 데이터를 더 유용하게 쓸 수 있다고 결론지음.","st":"문제 제기 → 사례 열거 → 해결 방안과 결론","v":"탐구, 열거, 제안, 결론","r":"실제 사례를 모은 뒤 기술적 해결책까지 연결","gr":"A","gx":false,"top":"서울대","src":"서울대 아로리 「나도 입학사정관」","loc":"학생 C 페이지, 발췌 6번째 문단","url":"https://snuarori.snu.ac.kr/admissions/officer?md=view&year=2024&college=20&dataidx=798","note":"","s":"정보"},{"n":970,"g":"정보","o":"정보","j":"내용 추정","y":2023,"yb":"입학 학년도","u":"서울대 공과대학 건축학과 학생 C","t":"첫 시간에 n각형 그리기를 반복문으로 구현하는 도전과제를 해결한 뒤 이후의 도전과제도 스스로 풀어 냄. 알고리즘 학습 사이트에서 문제를 풀고 막히면 친구들과 의논하며, '혼자 공부하는 파이선'으로 학습하여 tkinter 수업에서도 곧바로 기능을 추가함.","st":"도전과제 해결 → 알고리즘 학습 → 기능 추가","v":"구현, 해결, 의논, 추가","r":"배운 문법을 활용 과제로 바꾸고 동료와 함께 풂","gr":"A","gx":false,"top":"서울대","src":"서울대 아로리 「나도 입학사정관」","loc":"학생 C 페이지, 발췌 3번째 문단","url":"https://snuarori.snu.ac.kr/admissions/officer?md=view&year=2023&college=11&department=42&dataidx=740","note":"","s":"정보"},{"n":971,"g":"정보","o":"빅데이터 분석","j":"원문 명시","y":2022,"yb":"입학 학년도","u":"소프트웨어학과 지원 / 합격: 세종대학교 소프트웨어학과, 단국대학교 소프트웨어학과, 광운대학교 소프트웨어학과, 충북대학교 소프트웨어학과, 한양대학교 에리카","t":"수집한 데이터를 가공하고 시각화하는 분석 과정을 이해하고 Python과 Numpy, Pandas 모듈을 학습함. 포트폴리오에서는 배열을 만들고 차원을 바꾸는 Numpy 함수를 탐구해 완성함. 이어진 분석 프로젝트에서 차량의 수가 많을수록 교통사고가 더 잦은지 가설을 세워, 인구 수, 차량 수, 교통사고 건수 데이터를 분석하고 그래프로 시각화하여 교통사고가 차량 수와는 같이 늘지만 인구 수와는 꼭 그렇지 않다는 결과를 얻음. 후속 활동으로 빅데이터로 만든 챗봇이 실패한 이유를 탐구하며 개인정보 보호의 필요성과 AI 적용의 목표를 고찰함.","st":"모듈 학습 → 가설 설정 분석 → 챗봇 실패 탐구","v":"학습, 탐구, 분석, 시각화, 고찰","r":"가설 검증에 더해 사회적 이면까지 짚은 탐구","gr":"B","gx":false,"top":"한양대","src":"충북교육청 「선배들이 만든 대학입학 사례집」","loc":"PDF 407쪽부터, 과목 표의 빅데이터 분석","url":"https://blog.kakaocdn.net/dn/5Mkrx/btrQU9d3aXJ/b9KOo3Q8k06Zu00dOw0i60/2022.%20%EC%84%A0%EB%B0%B0%EB%93%A4%EC%9D%B4%20%EB%A7%8C%EB%93%A0%20%EB%8C%80%ED%95%99%EC%9E%85%ED%95%99%20%EC%82%AC%EB%A1%80%EC%A7%91%28%EC%B6%A9%EB%B6%81%EA%B5%90%EC%9C%A1%EC%B2%AD%29.pdf?attach=1&knm=tfile.pdf","note":"","s":"빅데이터 분석"},{"n":972,"g":"정보","o":"빅데이터 분석","j":"원문 명시","y":2022,"yb":"입학 학년도","u":"데이터과학과 지원 / 합격: 연세대학교 기계공학과, 포항공과대학교 무은재학과, 한양대학교 데이터사이언스학과, 성균관대학교 소프트웨어학","t":"웹크롤링으로 데이터를 수집하는 법을 익히고 코로나 발생 건수를 국가별 그래프로 그리는 실습을 함. 정보 기술로 만든 사물이 사회 문제를 살피는 데 쓰이는 점에 관심을 갖고 데이터 분석 프로젝트를 수행함. 사물인터넷 신호등이 달린 스마트 횡단보도에서 신호별로 건넌 인원 데이터를 모음. pandas의 info와 describe로 속성을 확인하고 usecols와 loc으로 필요한 부분만 뽑는 전처리를 거쳐, matplotlib 막대그래프로 4개월간 빨간불 때 건넌 사람 수의 변화 추이를 시각화함.","st":"크롤링 실습 → 데이터 수 <script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const ROWS=D.rows, SRC=D.src;
const GROUPS=[
 ['kor','국어','#B23A2E'],['math','수학','#2546C7'],['eng','영어','#6B3FA0'],['hist','한국사·역사','#8A4F1F'],
 ['soc','사회','#B0560A'],['eth','도덕·윤리','#8E4F6B'],['phy','물리','#1F6F87'],['chem','화학','#2F7A4C'],
 ['bio','생명과학','#55741A'],['earth','지구과학','#44579A'],['sci','통합과학·탐구','#2B746C'],['info','정보','#3D4955'],
 ['tech','기술·가정','#76661F'],['arts','예체능','#AE3D6B'],['lang','제2외국어·한문','#74508A'],['career','진로','#2A5F4E'],['etc','융합·기타','#5F6873']
];
const ALLC='#1E2229';
const G=Object.fromEntries(GROUPS.map(g=>[g[0],{slug:g[0],name:g[1],color:g[2]}]));
const BYNAME=Object.fromEntries(GROUPS.map(g=>[g[1],g[0]]));
const GRADE={A:'A 대학·합격 명시',B:'B 교육청·합격 명시',C:'C 대학·합격 미표기',D:'D 매체·학원 소개'};
const GCOL={A:'#5BD08F',B:'#9DB4FF',C:'#C9CDD3',D:'#FFB070'};
const GCOL2={A:'var(--a)',B:'var(--b)',C:'var(--c)',D:'var(--d)'};
ROWS.forEach(r=>{r.slug=BYNAME[r.g]||'etc';r.vs=r.v.split(',').map(s=>s.trim()).filter(Boolean);r.steps=r.st.split('→').map(s=>s.trim()).filter(Boolean);r.len=r.t.length;r.bytes=nb(r.t);r.hay=(r.t+' '+r.u+' '+r.s+' '+r.st+' '+r.v+' '+r.r+' '+r.src).toLowerCase();});
function nb(s){let b=0;for(const ch of s){b+=ch.codePointAt(0)<128?1:3;}return b;}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const years=[...new Set(ROWS.map(r=>r.y))].sort();
const BYN=Object.fromEntries(ROWS.map(r=>[r.n,r]));

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let saved=new Set(store.get('setuk-saved',[]));
function saveSet(){store.set('setuk-saved',[...saved]);document.getElementById('savedCnt').textContent=saved.size?String(saved.size):'';}

const S={};
function resetFilters(){Object.assign(S,{sub:null,verb:null,q:'',grades:new Set(['A','B','C','D']),yMin:years[0],top:false,len:'all',sort:'new',shown:30});}
resetFilters();
let filtersOpen=false;
const wide=()=>window.matchMedia('(min-width:901px)').matches;

const CNT={};ROWS.forEach(r=>CNT[r.slug]=(CNT[r.slug]||0)+1);
document.getElementById('tabList').innerHTML=
 `<li><a href="#all" data-s="all" style="--tc:${ALLC}">전체</a></li>`+
 GROUPS.filter(g=>CNT[g[0]]).map(g=>`<li><a href="#${g[0]}" data-s="${g[0]}" style="--tc:${g[2]}">${esc(g[1])}</a></li>`).join('');

let view='all';
function route(){
  const h=(location.hash||'').slice(1)||(store.get('setuk-visited',false)?'all':'about');
  store.set('setuk-visited',true);
  const prev=view;
  view=(h==='all'||h==='saved'||h==='about'||G[h])?h:'all';
  if(prev!==view) resetFilters();
  const browse=view!=='saved'&&view!=='about';
  document.querySelectorAll('#tabList a').forEach(a=>{if(a.dataset.s===view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  setNav('nav-browse',browse);setNav('nav-saved',view==='saved');setNav('nav-about',view==='about');
  const sc=G[view]?G[view].color:(view==='all'?ALLC:'var(--ink)');
  document.documentElement.style.setProperty('--sc',sc);
  render();
  if(prev!==view){window.scrollTo(0,0);const cur=document.querySelector('#tabList a[aria-current]');if(cur)cur.scrollIntoView({block:'nearest',inline:'nearest'});}
}
function setNav(id,on){const a=document.getElementById(id);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');}
window.addEventListener('hashchange',route);

function base(){if(view==='saved')return ROWS.filter(r=>saved.has(r.n));if(view==='all')return ROWS;return ROWS.filter(r=>r.slug===view);}
function filtered(b){
  const q=S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const out=b.filter(r=>(!S.sub||r.s===S.sub)&&(!S.verb||r.vs.includes(S.verb))&&S.grades.has(r.gr)&&r.y>=S.yMin&&(!S.top||r.top)
    &&(S.len==='all'||(S.len==='short'?r.len<100:r.len>=100))&&q.every(w=>r.hay.includes(w)));
  const so={new:(a,b)=>b.y-a.y||a.n-b.n,long:(a,b)=>b.len-a.len,short:(a,b)=>a.len-b.len,grade:(a,b)=>a.gr.localeCompare(b.gr)||b.y-a.y};
  return out.sort(so[S.sort]);
}
function tally(arr){const m=new Map();arr.forEach(x=>m.set(x,(m.get(x)||0)+1));return [...m].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ko'));}

function render(){
  const app=document.getElementById('app');
  if(view==='about'){app.innerHTML=bandAbout()+aboutHTML();return;}
  const b=base(), list=filtered(b);
  const qEl=document.activeElement&&document.activeElement.id==='q';
  const caret=qEl?document.activeElement.selectionStart:null;
  const det=document.getElementById('filt');if(det&&!wide())filtersOpen=det.open;
  app.innerHTML=band(b)+`<div class="body">${filters()}<main>${status(b,list)}<div class="list">${list.slice(0,S.shown).map(rec).join('')}</div>${empty(b,list)}${list.length>S.shown?`<button class="more" id="more" type="button">${Math.min(30,list.length-S.shown)}건 더 보기  (${S.shown} / ${list.length})</button>`:''}</main></div>`;
  if(qEl){const q=document.getElementById('q');q.focus();try{q.setSelectionRange(caret,caret)}catch(e){}}
  bind();
}
function band(b){
  if(view==='saved'){
    return `<section class="band plain"><div class="band-in"><div><h1>담아 둔 예시<small>${b.length}건</small></h1><p class="lede">‘담기’를 누른 예시가 이 브라우저에 모입니다. 수업 계획이나 세특 협의 때 다시 꺼내 보세요.</p></div></div></section>`;
  }
  const name=view==='all'?'전체 과목':G[view].name;
  const subs=tally(b.map(r=>r.s)), verbs=tally(b.flatMap(r=>r.vs)).slice(0,14);
  const gr=tally(b.map(r=>r.gr)).sort((x,y)=>x[0].localeCompare(y[0]));
  const short=b.filter(r=>r.len<100).length;
  const top3=subs.slice(0,3).map(s=>s[0]).join(', ');
  return `<section class="band"><div class="band-in">
    <div>
      <h1>${esc(name)}<small>합격생 기록 ${b.length}건</small></h1>
      <p class="lede">${esc(top3)} 순으로 예시가 많습니다. 한두 문장짜리 짧은 기록 ${short}건은 문장 하나의 짜임을, 한 문단 이상인 기록 ${b.length-short}건은 탐구가 이어지는 흐름을 볼 때 좋습니다.</p>
      ${view!=='all'?`<div class="subs" role="group" aria-label="세부 과목">${subs.map(([s,n])=>`<button class="chip" data-sub="${esc(s)}" aria-pressed="${S.sub===s}">${esc(s)}<span class="n">${n}</span></button>`).join('')}</div>`:''}
    </div>
    <div class="side-stats">
      <div><h3>자주 쓰인 과정 동사</h3><div class="verbs">${verbs.map(([v,n])=>`<button class="verb" data-verb="${esc(v)}" aria-pressed="${S.verb===v}">${esc(v)}<span class="n">${n}</span></button>`).join('')}</div></div>
      <div><h3>합격 근거 등급</h3><div class="stack">${gr.map(([g,n])=>`<span style="width:${(n/b.length*100).toFixed(2)}%;background:${GCOL[g]}" title="${GRADE[g]} ${n}건"></span>`).join('')}</div>
      <div class="legend">${gr.map(([g,n])=>`<i style="background:${GCOL[g]}"></i><span>${GRADE[g]}</span><em>${n}</em>`).join('')}</div></div>
    </div></div></section>`;
}
function bandAbout(){return `<section class="band plain"><div class="band-in"><div><h1>자료 안내<small>수집 2026. 11. 6. / 제작 순창고등학교 진로교육부</small></h1><p class="lede">어디서 모았는지, 등급은 무엇을 뜻하는지, 예시는 어떻게 읽는지 정리했습니다. 다 읽으셨으면 위쪽 탭에서 과목을 고르세요.</p></div></div></section>`;}
function filters(){
  return `<details class="filters" id="filt" ${(filtersOpen||wide())?'open':''}><summary>찾기와 거르기</summary><div class="fbody">
    <div class="fl"><input class="search" id="q" type="search" placeholder="학과, 소재, 동사로 찾기" value="${esc(S.q)}" aria-label="검색"></div>
    <div class="fl"><h4>합격 근거 등급</h4><div class="checks">${['A','B','C','D'].map(g=>`<label><input type="checkbox" data-g="${g}" ${S.grades.has(g)?'checked':''}><span class="sq" style="background:${GCOL2[g]}"></span>${GRADE[g]}</label>`).join('')}</div></div>
    <div class="fl"><h4>분량</h4><div class="radios" role="group" aria-label="분량">${[['all','전체'],['short','한두 문장'],['long','긴 문단']].map(([k,l])=>`<button type="button" data-len="${k}" aria-pressed="${S.len===k}">${l}</button>`).join('')}</div></div>
    <div class="fl"><h4>학년도</h4><select id="ymin" aria-label="학년도">${years.map(y=>`<option value="${y}" ${S.yMin===y?'selected':''}>${y}학년도부터</option>`).join('')}</select></div>
    <div class="fl"><h4>정렬</h4><select id="sort" aria-label="정렬"><option value="new" ${S.sort==='new'?'selected':''}>최근 학년도순</option><option value="grade" ${S.sort==='grade'?'selected':''}>근거 등급순</option><option value="long" ${S.sort==='long'?'selected':''}>긴 것부터</option><option value="short" ${S.sort==='short'?'selected':''}>짧은 것부터</option></select></div>
    <div class="fl checks"><label><input type="checkbox" id="top" ${S.top?'checked':''}>상위권 대학 합격·발행만</label></div>
    <div class="rule"><b>그대로 옮기지 마세요</b>모든 예시는 다른 학생의 활동을 다시 쓴 문장입니다. 옮겨 적으면 허위 기재가 됩니다. 흐름과 동사만 빌려 우리 학생이 실제로 한 활동을 쓰세요.</div>
  </div></details>`;
}
function status(b,list){
  const act=[S.sub&&S.sub,S.verb&&`‘${S.verb}’`].filter(Boolean);
  return `<p class="status"><strong>${list.length}건</strong>${act.length?`<span>${esc(act.join(' / '))}</span>`:''}${list.length!==b.length?`<button id="clear" type="button">조건 모두 풀기</button>`:''}</p>`;
}
function empty(b,list){
  if(view==='saved'&&!b.length)return `<div class="empty">아직 담아 둔 예시가 없습니다. 과목별 예시에서 ‘담기’를 눌러 모아 두세요.</div>`;
  if(!list.length)return `<div class="empty">조건에 맞는 예시가 없습니다. 검색어를 줄이거나 등급, 학년도 조건을 풀어 보세요.</div>`;
  return '';
}
function hl(t){
  let s=esc(t);
  S.q.trim().split(/\s+/).filter(Boolean).forEach(w=>{const e=esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');s=s.replace(new RegExp(e,'gi'),m=>`<mark>${m}</mark>`);});
  return s;
}
function rec(r){
  const yb=r.yb==='입학 학년도'?'입학':r.yb==='자료 학년도'?'자료':'게시';
  return `<article class="rec" style="--rc:${G[r.slug].color}">
    <div class="num">No.<b>${r.n}</b></div>
    <div>
      <div class="meta"><span class="subj">${esc(r.s)}</span><span>${esc(r.u)}</span><span>${r.y} ${yb}</span><span class="grade ${r.gr}" title="${esc(GRADE[r.gr])}">${r.gr}${r.gx?' 가공 의심':''}</span>${r.j==='내용 추정'?'<span class="est" title="원문에 과목명이 없어 활동 내용으로 분류">과목 추정</span>':''}</div>
      <p class="text">${hl(r.t)}</p>
      ${r.steps.length?`<ol class="flow" aria-label="전개 구조">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:''}
      ${r.r?`<p class="why"><b>눈여겨볼 점</b>${esc(r.r)}</p>`:''}
      ${r.vs.length?`<p class="tags"><b>과정 동사</b>${esc(r.vs.join(', '))}</p>`:''}
      ${r.note?`<p class="note">${esc(r.note)}</p>`:''}
      <div class="foot"><span>${r.len}자 / ${r.bytes}바이트</span><span>${esc(r.src)}${r.loc?`, ${esc(r.loc)}`:''}</span><span class="sp"></span>
        ${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">원문 열기</a>`:''}
        <button class="act" data-copy="${r.n}" type="button">구조 틀 복사</button>
        <button class="act" data-save="${r.n}" aria-pressed="${saved.has(r.n)}" type="button">${saved.has(r.n)?'담음':'담기'}</button></div>
    </div></article>`;
}
function bind(){
  const m=document.getElementById('app');
  const q=document.getElementById('q');
  if(q){let t;q.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>{S.q=q.value;S.shown=30;render();},180);});}
  m.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{S.sub=S.sub===b.dataset.sub?null:b.dataset.sub;S.shown=30;render();});
  m.querySelectorAll('[data-verb]').forEach(b=>b.onclick=()=>{S.verb=S.verb===b.dataset.verb?null:b.dataset.verb;S.shown=30;render();});
  m.querySelectorAll('[data-g]').forEach(b=>b.onchange=()=>{const g=b.dataset.g;if(b.checked)S.grades.add(g);else if(S.grades.size>1)S.grades.delete(g);S.shown=30;render();});
  m.querySelectorAll('[data-len]').forEach(b=>b.onclick=()=>{S.len=b.dataset.len;S.shown=30;render();});
  const y=document.getElementById('ymin');if(y)y.onchange=()=>{S.yMin=+y.value;S.shown=30;render();};
  const so=document.getElementById('sort');if(so)so.onchange=()=>{S.sort=so.value;render();};
  const tp=document.getElementById('top');if(tp)tp.onchange=()=>{S.top=tp.checked;S.shown=30;render();};
  const cl=document.getElementById('clear');if(cl)cl.onclick=()=>{resetFilters();render();};
  const mo=document.getElementById('more');if(mo)mo.onclick=()=>{S.shown+=30;render();};
  m.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const n=+b.dataset.save;if(saved.has(n))saved.delete(n);else saved.add(n);saveSet();if(view==='saved')render();else{b.setAttribute('aria-pressed',saved.has(n));b.textContent=saved.has(n)?'담음':'담기';}});
  m.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyFrame(BYN[+b.dataset.copy]));
}
function copyFrame(r){
  const txt=[`[${r.s}] 세특 구조 틀`,...r.steps.map((s,i)=>`${i+1}. ${s}: (우리 학생이 실제로 한 활동)`),`쓸 만한 과정 동사: ${r.vs.join(', ')}`].join('\n');
  const done=()=>toast('구조 틀을 복사했습니다. 예시 문장은 들어가지 않습니다.');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>fallback(txt,done));else fallback(txt,done);
}
function fallback(txt,done){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){toast('복사하지 못했습니다. 직접 선택해 복사하세요.');}ta.remove();}
let tt;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200);}

function aboutHTML(){
  const gc=tally(ROWS.map(r=>r.gr)).sort((a,b)=>a[0].localeCompare(b[0]));
  const desc={A:'서울대 아로리(결과 페이지에 학생 전원 신입생 명시)와 중앙대, 인하대, 숭실대, 명지대 가이드북의 합격 사례입니다.',B:'충청북도교육청 사례집 가운데 최종 합격이 확인된 학생만 넣었습니다.',C:'대학 가이드북의 평가 사례나 예시로, 합격 여부를 알 수 없습니다. 실제 학생 기록인지도 확인되지 않았습니다.',D:'입시 매체와 학원 글이 합격생 기록이라고 소개한 것입니다. 원본을 확인할 수 없으니 참고로만 보세요. ‘가공 의심’은 문체나 점수표로 보아 가공되었을 수 있는 글입니다.'};
  return `<div class="doc">
  <p>대학 입학처 가이드북, 서울대 아로리, 충청북도교육청 사례집 등 ${SRC.length}종에서 2022학년도 이후 합격생 세특 ${ROWS.length.toLocaleString()}건을 모아 과목별로 나눴습니다.</p>
  <h3>이 문장은 원문이 아닙니다</h3>
  <ul>
    <li>저작권 문제를 피하려고 표현을 새로 쓰고 원문 절반 이내로 줄였습니다. 소재, 방법, 수치, 결과는 살렸습니다.</li>
    <li>실제 문구는 ‘원문 열기’로 확인하세요. 아로리는 페이지 위쪽에서 해당 학생(A, B, C)을 고른 뒤 학교생활기록부 발췌에서 표시된 번째 문단을 찾으면 됩니다. PDF는 내려받은 뒤 표시된 쪽으로 이동하세요.</li>
    <li>다른 학생의 활동이므로 그대로 입력하면 허위 기재가 됩니다. 2026 기재요령은 AI 생성 자료를 그대로 입력하는 것도 신뢰도를 떨어뜨리는 사례로 듭니다. 구조와 소재를 고르는 참고로만 쓰세요.</li>
  </ul>
  <h3>예시 읽는 법</h3>
  <div class="gl">
    <b>전개 구조</b><span>원문 기록이 어떤 순서로 이어지는지 단계로 나눈 흐름선입니다. ‘구조 틀 복사’를 누르면 이 단계만 빈칸 틀로 복사됩니다.</span>
    <b>과정 동사</b><span>원문이 활동을 기록할 때 쓴 동사입니다. 과목 머리의 동사를 누르면 그 동사가 쓰인 예시만 모아 볼 수 있습니다.</span>
    <b>눈여겨볼 점</b><span>이 기록이 좋은 평가를 받은 이유를 정리했습니다.</span>
    <b>과목 추정</b><span>원문에 과목명이 없어 활동 내용으로 과목을 정한 기록입니다. 아로리 2024~2026학년도 자료에 많습니다.</span>
    <b>학년도</b><span>입학은 그 해 입학생의 기록, 자료는 가이드북 발행 학년도(학생의 입학 연도와 다를 수 있음), 게시는 글이 올라온 해입니다.</span>
    <b>글자와 바이트</b><span>나이스 기준으로 한글 3바이트, 영문·숫자·공백 1바이트로 셌습니다.</span>
    <b>상위권 대학</b><span>서울 주요 대학 등 15곳과 KAIST, 포항공대를 기준으로 한 거르기용 표시입니다. 대학 서열을 뜻하지 않습니다.</span>
  </div>
  <h3>합격 근거 등급</h3>
  <div class="gl">${gc.map(([g,n])=>`<span class="grade ${g}">${g}</span><span><b>${GRADE[g]}</b> ${n}건. ${desc[g]}</span>`).join('')}</div>
  <h3>출처 ${SRC.length}종</h3>
  <div class="tbl"><table class="srcs"><thead><tr><th>자료</th><th>종류</th><th>연도</th><th style="text-align:right">건수</th></tr></thead><tbody>
  ${SRC.map(s=>`<tr><td>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`:esc(s.name)}</td><td>${esc(s.kind)}</td><td>${esc(s.yr)}</td><td class="n">${s.cnt}</td></tr>`).join('')}
  </tbody></table></div>
  <h3>넣지 못한 자료</h3>
  <ul>
    <li>고려대, 성균관대, 서강대, 숙명여대는 세특 사례가 실린 공개 가이드북을 찾지 못했습니다. 이 대학 합격생 기록은 충북 사례집에 일부 들어 있습니다.</li>
    <li>2021학년도 이전 자료, 연도를 확인할 수 없는 글, 태도 평가뿐인 기록, 불합격 기록, 교사용 기재 예시나 지어낸 예시 문장은 뺐습니다.</li>
    <li>인하대 가이드북은 일부 내용을 첨삭했다고 스스로 밝히고 있어 해당 예시에 적었습니다.</li>
  </ul></div>`;
}
saveSet();
route();
})();
</script>
</body>
</html>
